name: Supabase koruma

# Ücretsiz Supabase projesi 1 hafta hiç kullanılmazsa uyur. Bu iş her gün bir kere
# küçük bir okuma yapar, proje hiç uyumaz (şoför tatile gitse bile).
# Ayrıca her gece veritabanını şifreleyip yedekler ve GitHub'ın zamanlanmış işleri
# kapatmaması için 50 günde bir küçük bir kayıt atar. Hepsi ücretsiz.
on:
  schedule:
    - cron: "17 3 * * *" # her gün 06.17 (Türkiye)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uyandir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase'e günlük okuma
        run: |
          URL=$(jq -r '.ayarlar.supabaseUrl // ""' data/site.json)
          KEY=$(jq -r '.ayarlar.supabaseAnonKey // ""' data/site.json)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase henüz ayarlı değil, atlandı."; exit 0; fi
          for i in 1 2 3; do
            KOD=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/durumlar?select=kod&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            if [ "$KOD" = "200" ]; then echo "Supabase uyanık."; exit 0; fi
            echo "Deneme $i: $KOD"; sleep 20
          done
          echo "::error::Supabase cevap vermiyor. Proje uyumuş olabilir: supabase.com panelinden 'Restore' de."
          exit 1

  yedek:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SIFRE: ${{ secrets.YEDEK_SIFRE }}
    steps:
      - name: Ayar var mı
        id: ayar
        run: |
          if [ -z "$DB_URL" ] || [ -z "$SIFRE" ]; then echo "SUPABASE_DB_URL ya da YEDEK_SIFRE yok, yedek atlandı."; echo "var=0" >> "$GITHUB_OUTPUT"; else echo "var=1" >> "$GITHUB_OUTPUT"; fi
      - name: PostgreSQL araçlarını kur
        if: steps.ayar.outputs.var == '1'
        run: |
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Yedekle ve şifrele
        if: steps.ayar.outputs.var == '1'
        run: |
          AD="yedek-$(date -u +%Y-%m-%d)"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f "$AD.sql"
          gzip "$AD.sql"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$SIFRE" -o "$AD.sql.gz.gpg" "$AD.sql.gz"
          rm "$AD.sql.gz"
          echo "AD=$AD" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: steps.ayar.outputs.var == '1'
        with:
          name: ${{ env.AD }}
          path: ${{ env.AD }}.sql.gz.gpg
          retention-days: 30

  canli-tut:
    # GitHub, 60 gün hiç kayıt olmayan açık depolarda zamanlanmış işleri durdurur.
    # 50 gündür kayıt yoksa küçük bir tarih dosyası güncellenir ([skip ci]: site yeniden yayınlanmaz).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          SON=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - SON )) -lt $(( 50 * 86400 )) ]; then echo "Depo canlı."; exit 0; fi
          date -u +%Y-%m-%d > .github/canli.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/canli.txt
          git commit -m "Zamanlanmış işler açık kalsın [skip ci]"
          git push
